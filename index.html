<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamensAdmin</title>

<style>

body{
    font-family:Arial;
    margin:20px;
    background:#f4f4f4;
}

h1{
    color:#222;
}

select,button{
    padding:10px;
    margin:5px;
    font-size:14px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:20px;
}

td{
    border:1px solid #999;
    padding:6px;
    text-align:center;
}

td[contenteditable="true"]{
    background:#fff8dc;
}

#status{
    margin-top:10px;
    font-weight:bold;
    color:green;
}

</style>

</head>

<body>

<h1>📊 ExamensAdmin</h1>
    <div id="dashboard" style="
    display:flex;
    gap:15px;
    margin:15px 0;
    flex-wrap:wrap;
">

    <div style="background:white;padding:10px 15px;border-radius:8px;min-width:180px;">
        👨‍🏫 Enseignants<br>
        <b id="stat_ens">-</b>
            </div>

        <div style="background:white;padding:10px 15px;border-radius:8px;min-width:180px;">
    📊 Par jour<br>
    <b id="stat_par_jour">-</b>
</div>
</div>

</div>

<select id="feuille">
    <option value="Departements">Departements</option>
    <option value="Jours">Jours</option>
    <option value="Surveillances">Surveillances</option>
    <option value="Historique_Convocations">Historique_Convocations</option>
</select>

<button onclick="charger()">📥 Charger</button>
<button onclick="sauvegarder()">💾 Enregistrer</button>

<div id="status"></div>

<table id="tableau"></table>

<script>

// ==========================
// API GOOGLE APPS SCRIPT
// ==========================
const API = "https://script.google.com/macros/s/AKfycbyZg4xjXxVHMwezbmL3YgdBN-2vudMsaMQ_ScvSV5MsrJn5Mwk6HdRt_wROb2nFk-jc/exec";


// ==========================
// CONFIG FEUILLES
// ==========================
const CONFIG = {

  Departements: 2,   // A, B
  Jours: 3,          // A, B, C
  Surveillances: 6,  // jusqu'à F
  Historique_Convocations: 6

};


// ==========================
// CHARGER DONNÉES
// ==========================
function charger(){

    const feuille = document.getElementById("feuille").value;

    fetch(API + "?mode=admin&feuille=" + encodeURIComponent(feuille))
    .then(r => r.json())
    .then(data => {

        if (data.status !== "success") {
            document.getElementById("status").innerText =
            "❌ " + data.message;
            return;
        }

        const maxCols = CONFIG[feuille];
        let html = "";

        data.data.forEach(row => {

            html += "<tr>";

            for(let j = 0; j < maxCols; j++){
                html += `<td contenteditable="true">${row[j] || ""}</td>`;
            }

            html += "</tr>";
        });

        document.getElementById("tableau").innerHTML = html;

        document.getElementById("status").innerText =
        "✔ Données chargées";
    })
    .catch(err => {
        console.error(err);
        document.getElementById("status").innerText =
        "❌ Erreur chargement API";
    });
}

// ==========================
// SAUVEGARDER
// ==========================
function sauvegarder(){

    const feuille =
    document.getElementById("feuille").value;

    const rows =
    document.getElementById("tableau").rows;

    const maxCols = CONFIG[feuille];

    let dataToSend = [];

    for(let i = 0; i < rows.length; i++){

        let valeurs = {};

        for(let j = 0; j < maxCols; j++){

            valeurs[j + 1] =
            rows[i].cells[j]
            ? rows[i].cells[j].innerText.trim()
            : "";
        }

        dataToSend.push({
            ligne: i + 1,
            valeurs: valeurs
        });
    }

    const formData = new FormData();

    formData.append("mode", "admin");
    formData.append("feuille", feuille);
    formData.append("data", JSON.stringify(dataToSend));

    fetch(API, {

        method: "POST",

        body: formData

    })

    .then(r => r.json())

    .then(res => {

        if(res.status === "success"){

            document.getElementById("status").innerText =
            "✔ Sauvegarde réussie";

        }else{

            document.getElementById("status").innerText =
            "❌ " + res.message;
        }
    })

    .catch(err => {

        console.error(err);

        document.getElementById("status").innerText =
        "❌ Erreur réseau";
    });
}
    // ==========================
// TABLEAU DE BORD
// ==========================
function chargerDashboard(){

    fetch(API + "?mode=admin&feuille=Departements")
    .then(r => r.json())
    .then(dep => {

        if(dep.status !== "success") return;

        let enseignants = 0;

dep.data.forEach((r, i) => {
    if (i > 0) {
        enseignants += parseInt(r[2]) || 0;
    }
});

        document.getElementById("stat_ens").innerText =
        enseignants;

    });

document.getElementById("stat_ens").innerText = "0";

fetch(API + "?mode=admin&feuille=Surveillances")
.then(r => r.json())
.then(surv => {

    if (!surv || !Array.isArray(surv.data) || surv.data.length <= 1) {
        console.warn("API vide");
        return;
    }

    let enseignantsSet = new Set();
    let joursMap = {};

    for (let i = 1; i < surv.data.length; i++) {

        let r = surv.data[i];
        if (!r) continue;

        let enseignant = (r[1] || "")
            .toString()
            .trim()
            .toLowerCase();

        let jour = (r[3] || "")
            .toString()
            .trim();

        if (enseignant) {
            enseignantsSet.add(enseignant);
        }

        if (jour) {
            joursMap[jour] = (joursMap[jour] || 0) + 1;
        }
    }

    const nbEns = enseignantsSet.size;

    // ✅ affichage final
    setTimeout(() => {

        document.getElementById("stat_ens").innerText = nbEns;

    }, 300);

    // =========================
    // 📊 TABLEAU PAR JOUR
    // =========================

    let html = `
    <table style="width:100%;border-collapse:collapse;background:white;">
        <tr style="background:#eee;">
            <th style="border:1px solid #ccc;padding:5px;">Jour</th>
            <th style="border:1px solid #ccc;padding:5px;">Nombre</th>
        </tr>
    `;

    Object.keys(joursMap).forEach(j => {

        html += `
        <tr>
            <td style="border:1px solid #ccc;padding:5px;">${j}</td>
            <td style="border:1px solid #ccc;padding:5px;text-align:center;">
                <b>${joursMap[j]}</b>
            </td>
        </tr>`;
    });

    html += "</table>";

    document.getElementById("stat_par_jour").innerHTML = html;

})
.catch(err => {
    console.error(err);
});


}
    chargerDashboard();
</script>

</body>
</html>
