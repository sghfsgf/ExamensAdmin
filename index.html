<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamensAdmin</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
    font-family:Arial;
    margin:20px;
    background:#f4f4f4;
}

/* MENU */
#menuPrincipal{
    background:#ffcc80;
    padding:15px;
    border-radius:10px;
    display:flex;
    gap:20px;
    justify-content:flex-start;
    align-items:center;
}

#menuPrincipal span{
    background:#ff9800;
    color:white;
    font-size:22px;
    font-weight:bold;
    padding:8px 15px;
    border-radius:8px;
    cursor:pointer;
}

#menuPrincipal span:hover{
    background:#f57c00;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:20px;
}

td{
    border:1px solid #999;
    padding:6px;
    text-align:center;
}

td[contenteditable="true"]{
    background:#fff8dc;
}

</style>

</head>

<body>

<!-- MENU -->
<div id="menuPrincipal">
    <span onclick="afficherAccueil()">🏠 Accueil</span>
    <span onclick="afficherDashboard()">📊 Dashboard</span>
</div>

<!-- ACCUEIL -->
<div id="pageAccueil">

    <h1 style="font-size:22px;background:#ff9800;color:white;padding:10px;border-radius:8px;">
        🏠 Accueil
    </h1>

    <div style="display:flex;gap:15px;margin:15px 0;flex-wrap:wrap;">
        <div style="background:white;padding:10px 15px;border-radius:8px;min-width:180px;">
            👨‍🏫 Enseignants<br>
            <b id="stat_ens">-</b>
        </div>

        <div style="background:white;padding:10px 15px;border-radius:8px;min-width:180px;">
            📊 Par jour<br>
            <b id="stat_par_jour">-</b>
        </div>
    </div>

</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

    <h1 style="font-size:22px;background:#ff9800;color:white;padding:10px;border-radius:8px;">
        📊 Dashboard
    </h1>

    <!-- 🔥 ZONE STATISTIQUES -->
    <div style="display:flex;gap:15px;flex-wrap:wrap;margin-top:15px;">

        <div style="background:white;padding:15px;border-radius:10px;min-width:200px;">
            👨‍🏫 Total enseignants<br>
            <b id="dash_ens">-</b>
        </div>

        <div style="background:white;padding:15px;border-radius:10px;min-width:200px;">
            📅 Total jours utilisés<br>
            <b id="dash_jours">-</b>
        </div>

        <div style="background:white;padding:15px;border-radius:10px;min-width:200px;">
            📊 Total surveillances<br>
            <b id="dash_surveillances">-</b>
        </div>

    </div>

</div>
   
</div>

<!-- TABLE + CONTROLES -->
<select id="feuille">
    <option value="Departements">Departements</option>
    <option value="Jours">Jours</option>
    <option value="Surveillances">Surveillances</option>
    <option value="Historique_Convocations">Historique_Convocations</option>
</select>

<button onclick="charger()">📥 Charger</button>
<button onclick="sauvegarder()">💾 Enregistrer</button>
<button onclick="exportExcel()">📊 Export Excel</button>

<div id="status"></div>

<table id="tableau"></table>

<!-- SCRIPT -->
<script>

const API = "https://script.google.com/macros/s/AKfycbyZg4xjXxVHMwezbmL3YgdBN-2vudMsaMQ_ScvSV5MsrJn5Mwk6HdRt_wROb2nFk-jc/exec";

/* NAVIGATION */
function afficherAccueil(){
    document.getElementById("pageAccueil").style.display = "block";
    document.getElementById("dashboard").style.display = "none";
}

function afficherDashboard(){
    document.getElementById("pageAccueil").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
}

/* EXPORT */
function exportExcel(){

    const table = document.getElementById("tableau");

    const wb = XLSX.utils.table_to_book(table, { sheet: "Examens" });

    XLSX.writeFile(wb, "ExamensAdmin.xlsx");
}

/* CONFIG */
const CONFIG = {
    Departements: 2,
    Jours: 3,
    Surveillances: 6,
    Historique_Convocations: 6
};

/* CHARGER */
function chargerDashboard(){

    fetch(API + "?mode=admin&feuille=Surveillances")
    .then(r => r.json())
    .then(surv => {

        let setEns = new Set();
        let jours = {};
        let total = 0;

        for(let i=1;i<surv.data.length;i++){

            let r = surv.data[i];
            if(!r) continue;

            let ens = (r[1] || "").trim();
            let j = (r[3] || "").trim();

            if(ens) setEns.add(ens);
            if(j) jours[j] = (jours[j]||0)+1;

            total++;
        }

        // =========================
        // 🏠 ACCUEIL (inchangé)
        // =========================
        document.getElementById("stat_ens").innerText = setEns.size;

        let html = "<table style='width:100%;background:white;'>";

        for(let j in jours){
            html += `<tr><td>${j}</td><td>${jours[j]}</td></tr>`;
        }

        document.getElementById("stat_par_jour").innerHTML = html;

        // =========================
        // 📊 DASHBOARD (NOUVEAU)
        // =========================
        if(document.getElementById("dash_ens")){

            document.getElementById("dash_ens").innerText = setEns.size;
            document.getElementById("dash_jours").innerText = Object.keys(jours).length;
            document.getElementById("dash_surveillances").innerText = total;
        }

    });
}

chargerDashboard();

</script>

</body>
</html>
