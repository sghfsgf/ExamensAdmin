<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamensAdmin</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
    font-family:Arial;
    margin:20px;
    background:#f4f4f4;
}

/* ===================== */
/* MENU PRINCIPAL (AMÉLIORÉ) */
/* ===================== */
.menu{
    background:#ffe0b2;
    padding:12px 15px;
    border-radius:10px;
    margin-bottom:15px;
    display:flex;
    gap:10px;
    align-items:center;
}

.menu button{
    border:none;
    cursor:pointer;
    padding:8px 12px;
    border-radius:6px;
    background:white;
    transition:0.2s;
}

.menu button:hover{
    background:#ffcc80;
}

.menu button.active{
    background:#ff9800;
    color:white;
    font-weight:bold;
}

/* ===================== */
.section{
    display:none;
    padding:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:15px;
}

td,th{
    border:1px solid #999;
    padding:6px;
    text-align:center;
}

#status{
    margin-top:10px;
    font-weight:bold;
    color:green;
}

</style>
</head>

<body>

<!-- ===================== -->
<!-- MENU PRINCIPAL -->
<!-- ===================== -->
<div class="menu">

  <button class="menu-btn active" onclick="showSection('examens', this)">
    📊 Examens
  </button>

  <button class="menu-btn" onclick="showSection('reclamations', this)">
    📩 Réclamations
  </button>

</div>

<!-- ===================== -->
<!-- SECTION EXAMENS -->
<!-- ===================== -->
<div id="section-examens" class="section" style="display:block;">

<h2>📊 ExamensAdmin</h2>

<select id="feuille">
    <option value="Departements">Departements</option>
    <option value="Jours">Jours</option>
    <option value="Surveillances">Surveillances</option>
    <option value="Historique_Convocations">Historique_Convocations</option>
</select>

<button onclick="charger()">📥 Charger</button>
<button onclick="sauvegarder()">💾 Enregistrer</button>
<button onclick="exportExcel()">📊 Export Excel</button>

<div id="status"></div>

<table id="tableau"></table>

</div>

<!-- ===================== -->
<!-- SECTION RECLAMATIONS -->
<!-- ===================== -->
<div id="section-reclamations" class="section">

<h2>📩 Réclamations</h2>

<div id="reclamationsContent">Chargement...</div>

</div>

<script>

// =====================
// API EXAMENS
// =====================
const API = "https://script.google.com/macros/s/AKfycbyZg4xjXxVHMwezbmL3YgdBN-2vudMsaMQ_ScvSV5MsrJn5Mwk6HdRt_wROb2nFk-jc/exec";

// =====================
// API RECLAMATIONS
// =====================
const URL_RECLAMATIONS = "https://script.google.com/macros/s/AKfycbzmDT5PUVdkn7WgrvgYDn9VZJ8JgFM-T1foEbFBxaFnI3a4DgDv_EN6Ndc08rqjApAzcA/exec";


// =====================
// NAVIGATION (SPA) + MENU ACTIVE
// =====================
function showSection(section, btn){

    document.querySelectorAll(".section").forEach(s=>{
        s.style.display="none";
    });

    document.getElementById("section-"+section).style.display="block";

    // reset active
    document.querySelectorAll(".menu-btn").forEach(b=>{
        b.classList.remove("active");
    });

    // set active
    if(btn) btn.classList.add("active");

    if(section === "reclamations"){
        loadReclamations();
    }
}


// =====================
// CONFIG EXAMENS
// =====================
const CONFIG = {
  Departements: 2,
  Jours: 3,
  Surveillances: 6,
  Historique_Convocations: 6
};


// =====================
// CHARGER EXAMENS
// =====================
function charger(){

    const feuille = document.getElementById("feuille").value;

    fetch(API + "?mode=admin&feuille=" + feuille)
    .then(r=>r.json())
    .then(data=>{

        let html="";

        data.data.forEach(row=>{
            html+="<tr>";

            for(let i=0;i<CONFIG[feuille];i++){
                html+=`<td contenteditable="true">${row[i] || ""}</td>`;
            }

            html+="</tr>";
        });

        document.getElementById("tableau").innerHTML=html;

    });

}


// =====================
// SAUVEGARDER
// =====================
function sauvegarder(){

    const rows = document.getElementById("tableau").rows;
    const feuille = document.getElementById("feuille").value;

    let data = [];

    for (let i = 0; i < rows.length; i++) {

        let c = rows[i].cells;
        let ligne = [];

        for (let j = 0; j < c.length; j++) {
            ligne.push(c[j].innerText);
        }

        data.push({
            ligne: i + 1,
            valeurs: ligne
        });
    }

    fetch(API, {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams({
            feuille: feuille,
            data: JSON.stringify(data)
        })
    })
    .then(r => r.json())
    .then(res => {

        const status = document.getElementById("status");
        status.innerText = res.message;
        status.style.color = res.status === "success" ? "green" : "red";

    })
    .catch(err => {
        console.log(err);
        document.getElementById("status").innerText = "❌ Erreur réseau";
    });
}


// =====================
// EXPORT EXCEL
// =====================
function exportExcel(){

    const table=document.getElementById("tableau");
    const wb=XLSX.utils.table_to_book(table,{sheet:"Examens"});
    XLSX.writeFile(wb,"Examens.xlsx");
}


// =====================
// RECLAMATIONS
// =====================
function loadReclamations(){

fetch(URL_RECLAMATIONS)
.then(r=>r.json())
.then(data=>{

    if(!Array.isArray(data)){
        document.getElementById("reclamationsContent")
        .innerHTML="❌ Données invalides";
        return;
    }

    let html=`
    <table>
        <tr style="background:#90caf9;color:white;">
            <th>Date</th>
            <th>Nom</th>
            <th>Email</th>
            <th>Département</th>
            <th>Type</th>
            <th>Message</th>
        </tr>
    `;

    data.reverse().forEach(r=>{
        html+=`
        <tr>
            <td>${r.Date || ""}</td>
            <td>${r["Nom et Prénom"] || ""}</td>
            <td>${r.Email || ""}</td>
            <td>${r.Département || ""}</td>
            <td>${r["Type de réclamation"] || ""}</td>
            <td style="text-align:left;">${r.Message || ""}</td>
        </tr>
        `;
    });

    html+="</table>";

    document.getElementById("reclamationsContent").innerHTML=html;

})
.catch(err=>{
    console.error(err);
    document.getElementById("reclamationsContent")
    .innerHTML="❌ Erreur chargement API";
});

}

</script>

</body>
</html>
