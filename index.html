<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamensAdmin</title>

<style>

body{
    font-family:Arial;
    margin:20px;
    background:#f4f4f4;
}

h1{
    color:#222;
}

select,button{
    padding:10px;
    margin:5px;
    font-size:14px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:20px;
}

td{
    border:1px solid #999;
    padding:6px;
    text-align:center;
}

td[contenteditable="true"]{
    background:#fff8dc;
}

#status{
    margin-top:10px;
    font-weight:bold;
    color:green;
}

</style>

</head>

<body>

<h1>📊 ExamensAdmin</h1>

<select id="feuille">
    <option value="Departements">Departements</option>
    <option value="Jours">Jours</option>
    <option value="Surveillances">Surveillances</option>
    <option value="Historique_Convocations">Historique_Convocations</option>
</select>

<button onclick="charger()">📥 Charger</button>
<button onclick="sauvegarder()">💾 Enregistrer</button>

<div id="status"></div>

<table id="tableau"></table>

<script>

// ==========================
// API GOOGLE APPS SCRIPT
// ==========================
const API = "https://script.google.com/macros/s/AKfycbyZg4xjXxVHMwezbmL3YgdBN-2vudMsaMQ_ScvSV5MsrJn5Mwk6HdRt_wROb2nFk-jc/exec";


// ==========================
// CONFIG FEUILLES
// ==========================
const CONFIG = {

  Departements: 2,   // A, B
  Jours: 3,          // A, B, C
  Surveillances: 6,  // jusqu'à F
  Historiques_Convocations: 6

};


// ==========================
// CHARGER DONNÉES
// ==========================
function charger(){

    const feuille = document.getElementById("feuille").value;

    fetch(API + "?mode=admin&feuille=" + encodeURIComponent(feuille))
    .then(r => r.json())
    .then(data => {

        if (data.status !== "success") {
            document.getElementById("status").innerText =
            "❌ " + data.message;
            return;
        }

        const maxCols = CONFIG[feuille];
        let html = "";

        data.data.forEach(row => {

            html += "<tr>";

            for(let j = 0; j < maxCols; j++){
                html += `<td contenteditable="true">${row[j] || ""}</td>`;
            }

            html += "</tr>";
        });

        document.getElementById("tableau").innerHTML = html;

        document.getElementById("status").innerText =
        "✔ Données chargées";
    })
    .catch(err => {
        console.error(err);
        document.getElementById("status").innerText =
        "❌ Erreur chargement API";
    });
}

// ==========================
// SAUVEGARDER
// ==========================
function sauvegarder(){

    const feuille = document.getElementById("feuille").value;
    const rows = document.getElementById("tableau").rows;
    const maxCols = CONFIG[feuille];

    let requests = [];

    for(let i = 0; i < rows.length; i++){

        let valeurs = {};

        for(let j = 0; j < maxCols; j++){

            valeurs[j+1] = rows[i].cells[j].innerText;
        }

        requests.push(fetch(API, {
            method:"POST",
            body: JSON.stringify({
                feuille: feuille,
                ligne: i + 1,
                valeurs: valeurs
            })
        }));
    }

    Promise.all(requests)
    .then(() => {

        document.getElementById("status").innerText =
        "✔ Sauvegarde réussie";
    })
    .catch(() => {

        document.getElementById("status").innerText =
        "❌ Erreur sauvegarde";
    });

}

</script>

</body>
</html>
