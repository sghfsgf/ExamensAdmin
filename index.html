<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamensAdmin</title>

<!-- XLSX -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
    font-family:Arial;
    margin:20px;
    background:#f4f4f4;
}

h1{
    color:#222;
}

select,button{
    padding:10px;
    margin:5px;
    font-size:14px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:20px;
}

td{
    border:1px solid #999;
    padding:6px;
    text-align:center;
}

td[contenteditable="true"]{
    background:#fff8dc;
}

#status{
    margin-top:10px;
    font-weight:bold;
    color:green;
}

</style>

</head>

<body>

<h1>📊 ExamensAdmin</h1>

<div id="dashboard" style="display:flex;gap:15px;margin:15px 0;flex-wrap:wrap;">

    <div style="background:white;padding:10px 15px;border-radius:8px;min-width:180px;">
        👨‍🏫 Enseignants<br>
        <b id="stat_ens">-</b>
    </div>

    <div style="background:white;padding:10px 15px;border-radius:8px;min-width:180px;">
        📊 Par jour<br>
        <b id="stat_par_jour">-</b>
    </div>

</div>

<select id="feuille">
    <option value="Departements">Departements</option>
    <option value="Jours">Jours</option>
    <option value="Surveillances">Surveillances</option>
    <option value="Historique_Convocations">Historique_Convocations</option>
</select>

<button onclick="charger()">📥 Charger</button>
<button onclick="sauvegarder()">💾 Enregistrer</button>
<button onclick="exportExcel()">📊 Export Excel</button>

<!-- 🔴 STATUS -->
<div id="status"></div>

<!-- 🔴 TABLE PRINCIPALE -->
<table id="tableau"></table>

<script>

// ==========================
// API GOOGLE APPS SCRIPT
// ==========================
const API = "https://script.google.com/macros/s/AKfycbyZg4xjXxVHMwezbmL3YgdBN-2vudMsaMQ_ScvSV5MsrJn5Mwk6HdRt_wROb2nFk-jc/exec";


// ==========================
// EXPORT EXCEL (CORRIGÉ)
// ==========================
function exportExcel() {

  const table = document.getElementById("tableau"); // ✅ CORRECT

  if (!table || table.rows.length === 0) {
    alert("Aucune donnée à exporter !");
    return;
  }

  const rows = Array.from(table.rows).filter(row => {
    return row.style.display !== "none";
  });

  const tempTable = document.createElement("table");
  rows.forEach(r => tempTable.appendChild(r.cloneNode(true)));

  const wb = XLSX.utils.table_to_book(tempTable, { sheet: "Examens" });

  const fileName =
    "ExamensAdmin_" +
    new Date().toISOString().slice(0,10) +
    ".xlsx";

  XLSX.writeFile(wb, fileName);
}


// ==========================
// CONFIG FEUILLES
// ==========================
const CONFIG = {
  Departements: 2,
  Jours: 3,
  Surveillances: 6,
  Historique_Convocations: 6
};


// ==========================
// CHARGER DONNÉES
// ==========================
function charger(){

    const feuille = document.getElementById("feuille").value;

    fetch(API + "?mode=admin&feuille=" + encodeURIComponent(feuille))
    .then(r => r.json())
    .then(data => {

        if (data.status !== "success") {
            document.getElementById("status").innerText =
            "❌ " + data.message;
            return;
        }

        const maxCols = CONFIG[feuille];
        let html = "";

        data.data.forEach(row => {

            html += "<tr>";

            for(let j = 0; j < maxCols; j++){
                html += `<td contenteditable="true">${row[j] || ""}</td>`;
            }

            html += "</tr>";
        });

        document.getElementById("tableau").innerHTML = html;

        document.getElementById("status").innerText =
        "✔ Données chargées";
    })
    .catch(err => {
        console.error(err);
        document.getElementById("status").innerText =
        "❌ Erreur chargement API";
    });
}


// ==========================
// SAUVEGARDER
// ==========================
function sauvegarder(){

    const feuille = document.getElementById("feuille").value;
    const rows = document.getElementById("tableau").rows;
    const maxCols = CONFIG[feuille];

    let dataToSend = [];

    for(let i = 0; i < rows.length; i++){

        let valeurs = {};

        for(let j = 0; j < maxCols; j++){

            valeurs[j + 1] =
            rows[i].cells[j]
            ? rows[i].cells[j].innerText.trim()
            : "";
        }

        dataToSend.push({
            ligne: i + 1,
            valeurs: valeurs
        });
    }

    const formData = new FormData();

    formData.append("mode", "admin");
    formData.append("feuille", feuille);
    formData.append("data", JSON.stringify(dataToSend));

    fetch(API, {
        method: "POST",
        body: formData
    })
    .then(r => r.json())
    .then(res => {

        document.getElementById("status").innerText =
        res.status === "success"
        ? "✔ Sauvegarde réussie"
        : "❌ " + res.message;

    })
    .catch(err => {

        console.error(err);

        document.getElementById("status").innerText =
        "❌ Erreur réseau";
    });
}


// ==========================
// DASHBOARD
// ==========================
function chargerDashboard(){

    fetch(API + "?mode=admin&feuille=Departements")
    .then(r => r.json())
    .then(dep => {

        if(dep.status === "success"){

            let enseignants = 0;

            dep.data.forEach((r, i) => {
                if (i > 0) {
                    enseignants += parseInt(r[2]) || 0;
                }
            });

            document.getElementById("stat_ens").innerText = enseignants;
        }
    });


    fetch(API + "?mode=admin&feuille=Surveillances")
    .then(r => r.json())
    .then(surv => {

        if (!surv || !Array.isArray(surv.data)) return;

        let joursMap = {};

        for (let i = 1; i < surv.data.length; i++) {

            let r = surv.data[i];
            if (!r) continue;

            let jour = (r[3] || "").toString().trim();

            if (jour) {
                joursMap[jour] = (joursMap[jour] || 0) + 1;
            }
        }

        let html = "<table style='width:100%;background:white;border-collapse:collapse;'>";

        for (let j in joursMap) {
            html += `
            <tr>
                <td style="border:1px solid #ccc;padding:5px;">${j}</td>
                <td style="border:1px solid #ccc;padding:5px;text-align:center;">
                    <b>${joursMap[j]}</b>
                </td>
            </tr>`;
        }

        html += "</table>";

        document.getElementById("stat_par_jour").innerHTML = html;
    });
}

chargerDashboard();

</script>

</body>
</html>
